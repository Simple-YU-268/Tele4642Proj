<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel WiFi Service</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .container { 
            background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%; max-width: 400px; overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #667eea, #764ba2); color: white;
            padding: 30px; text-align: center;
        }
        .form-section { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        input, select { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 16px; transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }
        .btn { 
            width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px; font-size: 16px;
            cursor: pointer; transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .plan-card { 
            border: 1px solid #ddd; border-radius: 10px; padding: 15px; margin: 10px 0;
            cursor: pointer; transition: all 0.3s;
        }
        .plan-card:hover { border-color: #667eea; }
        .plan-card.selected { 
            background: linear-gradient(135deg, #667eea, #764ba2); color: white;
        }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .error { color: #e74c3c; margin-bottom: 15px; }
        .success { color: #27ae60; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Hotel WiFi Service</h2>
            <p>Fast & Secure Internet</p>
        </div>

        <div class="form-section">
            <!-- Login -->
            <div class="step active" id="login-step">
                <h3>Sign In</h3>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button class="btn" onclick="login()">Sign In</button>
            </div>

            <!-- Plan Selection -->
            <div class="step" id="plan-step">
                <h3>Select Plan</h3>
                <p>Current: <span id="current-quota">0 GB</span></p>
                <div id="plans">
                    <div class="plan-card" onclick="selectPlan('0GB')">
                        <strong>Free</strong> - 0GB - $0
                    </div>
                    <div class="plan-card" onclick="selectPlan('10G')">
                        <strong>10GB</strong> - $5
                    </div>
                    <div class="plan-card" onclick="selectPlan('30G')">
                        <strong>30GB</strong> - $12
                    </div>
                    <div class="plan-card" onclick="selectPlan('50G')">
                        <strong>50GB</strong> - $18
                    </div>
                </div>
                <button class="btn" onclick="confirmPlan()" id="plan-btn" disabled>Continue</button>
            </div>

            <!-- Payment -->
            <div class="step" id="payment-step">
                <h3>Payment</h3>
                <p>Plan: <span id="selected-plan-text">10GB</span> - $<span id="selected-price">5</span></p>
                <div class="form-group">
                    <input type="text" id="card" placeholder="Card Number" maxlength="19">
                </div>
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
                    <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
                    <input type="text" id="cvv" placeholder="CVV" maxlength="3">
                </div>
                <button class="btn" onclick="processPayment()">Pay Now</button>
            </div>

            <!-- Device -->
            <div class="step" id="device-step">
                <h3>Connect Device</h3>
                <p>New Balance: <span id="new-quota">0 GB</span></p>
                <div class="form-group">
                    <input type="text" id="mac" placeholder="MAC Address (00:1A:2B:3C:4D:5E)" maxlength="17">
                </div>
                <button class="btn" onclick="connectDevice()">Connect</button>
            </div>

            <!-- Success -->
            <div class="step" id="success-step">
                <div style="text-align: center;">
                    <h3 style="color: #27ae60;">✓ Success!</h3>
                    <p>Device connected. Data: <span id="final-quota">0 GB</span></p>
                    <button class="btn" onclick="location.reload()">Add Another</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedPlan = '';
        const API = 'http://127.0.0.1:5000';

        function showStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(step).classList.add('active');
        }

        function formatBytes(bytes) {
            return (bytes / (1024**3)).toFixed(1) + ' GB';
        }

        // Format inputs
        document.getElementById('card').addEventListener('input', e => {
            e.target.value = e.target.value.replace(/\s/g, '').replace(/(.{4})/g, '$1 ').trim();
        });
        document.getElementById('expiry').addEventListener('input', e => {
            e.target.value = e.target.value.replace(/\D/g, '').replace(/(\d{2})(\d{0,2})/, '$1/$2');
        });
        document.getElementById('mac').addEventListener('input', e => {
            e.target.value = e.target.value.replace(/[^0-9A-Fa-f]/g, '').replace(/(.{2})/g, '$1:').slice(0, -1).toUpperCase();
        });

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch(`${API}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                document.getElementById('current-quota').textContent = formatBytes(data.quota);
                showStep('plan-step');
            } else {
                alert('Login failed');
            }
        }

        function selectPlan(plan) {
            selectedPlan = plan;
            document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('plan-btn').disabled = false;
            
            if (plan === '0GB') {
                document.getElementById('selected-plan-text').textContent = 'Free';
                document.getElementById('selected-price').textContent = '0';
            } else {
                const prices = {'10G': 5, '30G': 12, '50G': 18};
                document.getElementById('selected-plan-text').textContent = plan;
                document.getElementById('selected-price').textContent = prices[plan];
            }
        }

        async function confirmPlan() {
            if (selectedPlan === '0GB') {
                showStep('device-step');
            } else {
                showStep('payment-step');
            }
        }

        async function processPayment() {
            const email = document.getElementById('email').value;
            const card = document.getElementById('card').value.replace(/\s/g, '');
            const expiry = document.getElementById('expiry').value;
            const cvv = document.getElementById('cvv').value;

            const res = await fetch(`${API}/payment`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, card_number: card, cvv, expiry_date: expiry})
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                document.getElementById('new-quota').textContent = formatBytes(data.quota);
                showStep('device-step');
            } else {
                alert('Payment failed');
            }
        }

        async function connectDevice() {
            const email = document.getElementById('email').value;
            const mac = document.getElementById('mac').value;

            const res = await fetch(`${API}/connect_device`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, mac})
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                document.getElementById('final-quota').textContent = formatBytes(data.quota);
                showStep('success-step');
            } else {
                alert('Connection failed');
            }
        }
    </script>
</body>
</html>
